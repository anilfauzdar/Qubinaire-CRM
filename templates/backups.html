 {% extends 'base.html' %}{% block content %}<h1>Database Backups</h1><p class="muted">रोज़ पहली CRM activity पर automatic consistent database snapshot बनता है। Latest 30 backups रखे जाते हैं।</p><section class="panel"><form method="post" action="/admin/backups/run"><button>Create Backup Now</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>Backup file</th><th>Download</th></tr>{% for f in files %}<tr><td>{{f}}</td><td><a href="/admin/backups/download/{{f}}">Download DB</a></td></tr>{% else %}<tr><td colspan="2">No backups yet</td></tr>{% endfor %}</table></div></section>{% endblock %}
