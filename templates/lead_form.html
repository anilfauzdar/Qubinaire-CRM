{% extends "base.html" %}{% block content %}<section class="panel"><h1>Add Lead</h1><form id="lead-form" method="post" class="formgrid"><div><label>Lead Type</label><select name="lead_type"><option value="student">Student</option><option value="college">College / University</option></select></div><div><label>Name / Contact Person</label><input name="name" required></div><div><label>Phone</label><input name="phone"></div><div><label>Email</label><input name="email" type="email"></div><div><label>Institution</label><input name="institution"></div><div><label>Course / Partnership Interest</label><input name="course_interest"></div><div><label>City</label><input name="city"></div><div><label>District</label><input name="district"></div><div><label>State</label><input name="state"></div><div><label>Source</label><input name="source"></div><div><label>Status</label><select name="status"><option>new</option><option>contacted</option><option>interested</option><option>qualified</option><option>follow-up</option><option>meeting</option><option>converted</option><option>lost</option></select></div><div class="full"><label>Notes</label><textarea name="notes"></textarea></div><div class="full"><button>Save Lead</button><small id="save-hint" class="muted">Online save. Offline queue is available after the app shell is cached and you have logged in.</small></div></form></section>{% endblock %}
