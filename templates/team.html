{% extends 'base.html' %}{% block content %}<h1>Team Performance</h1><section class="panel"><div class="table-wrap"><table><tr><th>Employee</th><th>Role</th><th>Manager</th><th>Leads</th><th>Admissions</th><th>Status</th></tr>{% for m in members %}<tr><td>{{m.full_name}}</td><td>{{m.role}}</td><td>{{m.manager_name or '—'}}</td><td>{{m.leads_count}}</td><td>{{m.admissions_count}}</td><td>{{'Active' if m.active else 'Disabled'}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
