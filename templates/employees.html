{% extends "base.html" %}{% block content %}<h1>Employee Management</h1><section class="panel"><form method="post" class="formgrid"><div><label>Name</label><input name="name" required></div><div><label>Username</label><input name="username" required></div><div><label>Temporary Password (12+)</label><input name="password" type="password" minlength="12" required></div><div><label>Role</label><select name="role"><option value="sales">Sales</option><option value="manager">Manager</option><option value="admin">Admin</option></select></div><div><label>Reporting Manager (Sales only)</label><select name="manager_id"><option value="">Unassigned</option>{% for m in managers %}<option value="{{m.id}}">{{m.full_name}}</option>{% endfor %}</select></div><div class="full"><button>Create User</button></div></form></section><section class="panel"><div class="tablewrap"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Manager</th><th>Status</th><th>Action</th></tr>{% for u in rows %}<tr><td>{{u.full_name}}</td><td>{{u.username}}</td><td>{{u.role}}</td><td>{{u.manager_name or '—'}}</td><td>{{'Active' if u.active else 'Disabled'}}</td><td><form method="post" action="/employees/{{u.id}}/toggle"><button class="secondary small">{{'Disable' if u.active else 'Enable'}}</button></form></td></tr>{% endfor %}</table></div></section>{% endblock %}
